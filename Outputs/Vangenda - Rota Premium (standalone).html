document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tion:absolute; inset:0; pointer-events:none; overflow:hidden; opacity:0.9; }\n.hero-road svg { position:absolute; width:100%; height:100%; }\n.hero-content { position:relative; z-index:2; }\n\n.hero-eyebrow {\n  display:inline-flex; align-items:center; gap:8px;\n  background: var(--gold-soft);\n  border: 1px solid var(--gold-line);\n  color: var(--gold);\n  font-family: var(--font-ui);\n  font-size: 0.7rem; font-weight:500;\n  letter-spacing: 0.16em; text-transform:uppercase;\n  padding: 7px 18px; border-radius:50px; margin-bottom:28px;\n}\n.hero h1 {\n  font-family: var(--font-display);\n  font-size: clamp(2rem, 6vw, 3.6rem);\n  font-weight: 700;\n  line-height: 1.12;\n  letter-spacing: -0.5px;\n  color: var(--text);\n  margin-bottom: 24px; padding: 0 12px;\n}\n.hero h1 em { font-style: italic; color: var(--gold); }\n.hero .sub {\n  font-size: clamp(1rem, 2.4vw, 1.2rem);\n  font-weight: 300;\n  color: var(--text-2);\n  max-width: 620px; margin: 0 auto 30px; line-height:1.7; padding: 0 16px;\n}\n.hero .sub strong { color: var(--text); font-weight:400; }\n.hero-stat {\n  display:inline-flex; align-items:center; gap:10px;\n  background: rgba(255,255,255,0.03);\n  border: 1px solid var(--line);\n  border-left: 2px solid var(--gold);\n  padding: 13px 24px; border-radius: var(--radius-sm);\n  font-family: var(--font-ui); font-size: 0.82rem; letter-spacing:0.02em;\n  color: var(--text-2);\n  margin: 0 16px 36px;\n}\n.hero-stat strong { color: var(--gold); font-weight:500; }\n.hero img.mockup {\n  max-width: 400px; width:86%; margin: 0 auto 40px;\n  border-radius: 22px;\n  box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 0 1px var(--gold-line), 0 0 60px rgba(200,169,110,0.08);\n}\n\n/* ---------- CTA BUTTON (shimmer) ---------- */\n.cta-btn {\n  display:inline-block; position:relative; overflow:hidden;\n  background: var(--gold);\n  color: #1A130A;\n  font-family: var(--font-ui);\n  font-weight: 700; font-size: clamp(0.82rem, 2vw, 0.95rem);\n  letter-spacing: 0.1em; text-trans 80px; margin:44px auto 0; }\n.acesso-card { background: var(--card); border:1px solid var(--gold-soft); border-radius: var(--radius-lg); padding:32px 22px; text-align:center; transition: border-color .3s, transform .3s; }\n.acesso-card:hover { border-color: var(--gold); transform: translateY(-4px); }\n.acesso-icon { width:58px; height:58px; background: var(--gold-soft); border:1px solid var(--gold-line); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; margin:0 auto 18px; }\n.acesso-card h3 { font-family: var(--font-ui); font-size:0.74rem; text-transform:uppercase; letter-spacing:0.12em; margin-bottom:10px; color: var(--gold); }\n.acesso-card p { font-size:0.86rem; color: var(--text-2); margin:0; line-height:1.6; }\n\n/* ---------- DEPOIMENTOS ---------- */\n.depoimentos-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; margin-top:40px; }\n.dep-card { background: var(--card); border:1px solid var(--gold-soft); border-radius: var(--radius-lg); padding:30px 26px 26px; position:relative; }\n.dep-quote { font-size:3.5rem; color: var(--gold); font-family: var(--font-display); line-height:1; position:absolute; top:12px; left:20px; opacity:0.5; }\n.dep-card p { font-family: var(--font-display); font-style:italic; padding-top:26px; font-size:1rem; color: var(--text); font-weight:400; }\n.dep-autor { margin-top:16px; font-family: var(--font-ui) !important; font-style:normal !important; font-weight:500; color: var(--gold) !important; font-size:0.78rem; letter-spacing:0.04em; }\n\n/* ---------- GARANTIA SEÇÃO ---------- */\n.garantia-box { background: var(--card); max-width:640px; margin:40px auto 0; padding:44px 36px; border-radius: var(--radius-lg); text-align:center; box-shadow:0 24px 60px rgba(0,0,0,0.5); border:1px solid var(--gold-line); }\n.garantia-badge { width:160px; height:160px; background: var(--gold-soft); border:1px solid var(--gold-line); color: var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:5rem; margin:0 auto 18px; }\n\n/* ---------- FAQ ---------- */\n.faq-item { border:1px solid var(--line); background: var(--card); margin-bottom:8px; border-radius: var(--radius); overflow:hidden; }\n.faq-question { padding:20px 24px; cursor:pointer; font-family: var(--font-ui); font-weight:500; color: var(--text); display:flex; justify-content:space-between; align-items:center; transition: background .2s; font-size:0.95rem; gap:12px; }\n.faq-question:hover { background: rgba(255,255,255,0.02); }\n.faq-icon { width:28px; height:28px; background: transparent; color: var(--gold); border:1px solid var(--gold-line); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.1rem; font-weight:400; flex-shrink:0; transition: transform .3s, background .2s, color .2s; }\n.faq-item.ativo .faq-icon { transform: rotate(45deg); background: var(--gold); color:#1A130A; }\n.faq-answer { max-height:0; overflow:hidden; transition: max-height .4s ease; padding:0 24px; font-size:0.93rem; color: var(--text-2); }\n.faq-item.ativo .faq-answer { max-height:240px; padding:0 24px 20px; }\n\n/* ---------- URGÊNCIA ---------- */\n.urgencia { background: radial-gradient(100% 80% at 50% 0, rgba(224,107,107,0.10), transparent 60%), var(--bg); border-top:1px solid var(--line); border-bottom:1px solid var(--line); color: var(--text); text-align:center; padding:96px 0; }\n.urgencia h2 { color: var(--text); }\n.urgencia h2 em { color: var(--gold); font-style:italic; }\n.urgencia p { color: var(--text-2); }\n\n/* ---------- FECHAMENTO ---------- */\n.fechamento { background: radial-gradient(120% 80% at 50% 100%, rgba(74,158,255,0.10), transparent 60%), var(--bg-alt); color: var(--text); text-align:center; padding:96px 0; }\n.fechamento h2 { color: var(--text); }\n.fechamento h2 em { color: var(--gold); font-style:italic; }\n.fechamento p { color: var(--text-2); }\n.fechamento p[style*=\"color:white\"] { color: var(--text) !important; }\n\n/* ---------- FOOTER (mapa de rotas) ---------- */\nfooter { background:#05070F; color: var(--text-2); padding:56px 0 28px; font-size:0.84rem; position:relative; overflow:hidden; }\nfooter::before {\n  content:''; position:absolute; inset:0; pointer-events:none; opacity:0.5;\n  background-image:\n    linear-gradient(115deg, transparent 49.8%, rgba(74,158,255,0.10) 50%, transparent 50.2%),\n    linear-gradient(60deg, transparent 49.8%, rgba(74,158,255,0.07) 50%, transparent 50.2%),\n    radial-gradient(circle, rgba(74,158,255,0.4) 1.5px, transparent 2px);\n  background-size: 220px 220px, 320px 320px, 180px 180px;\n}\nfooter .container { position:relative; z-index:1; }\nfooter .brand { font-family: var(--font-display); font-style:italic; font-weight:700; color: var(--text); font-size:1.5rem; margin-bottom:12px; }\nfooter a { color: var(--gold); }\nfooter a:hover { text-decoration:underline; }\n.footer-bottom { text-align:center; border-top:1px solid rgba(200,169,110,0.12); padding-top:22px; margin-top:34px; }\n\n/* ---------- BÔNUS ---------- */\n.bonus-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; margin-top:32px; }\n.bonus-card { background: var(--gold-soft); padding:28px 24px; border-radius: var(--radius-lg); border:1px dashed var(--gold-line); }\n.bonus-tag { display:inline-block; background: var(--gold); color:#1A130A; font-family: var(--font-ui); font-weight:700; padding:5px 14px; border-radius:50px; font-size:0.72rem; margin-bottom:10px; letter-spacing:0.06em; }\n\n/* ---------- SCROLL REVEAL ---------- */\n.reveal { opacity:0; transform: translateY(30px); transition: opacity .6s ease, transform .6s ease; }\n.reveal.visible { opacity:1; transform:none; }\n\n/* ---------- RESPONSIVE ---------- */\n@media (max-width:768px){\n  section, .oferta, .urgencia, .fechamento { padding:64px 0; }\n  .solucao-inner { grid-template-columns:1fr; gap:36px; }\n  .comparacao { grid-template-columns:1fr; }\n  .duas-opcoes { grid-template-columns:1fr; }\n  .garantia-oferta { flex-direction:column; text-align:center; }\n  .garantia-oferta .garantia-txt { text-align:center; }\n  .cta-btn { padding:17px 30px; width:100%; text-align:center; display:block; }\n  .hero { padding:72px 0 56px; }\n}\n@media (max-width:480px){\n  .container { padding:0 18px; }\n  .planos-grid, .beneficios-grid, .depoimentos-grid, .acesso-grid { grid-template-columns:1fr; }\n  .passos { grid-template-columns:1fr 1fr; }\n}\n@media (prefers-reduced-motion: reduce){\n  *, *::before, *::after { animation:none !important; transition:none !important; }\n  .reveal { opacity:1; transform:none; }\n}\n:focus-visible { outline:2px solid var(--gold); outline-offset:3px; border-radius:4px; }\n\n<\u002Fstyle>\n<\u002Fhead>\n\n<body>\n\n<!-- TOP BAR -->\n<div class=\"top-bar\">\n  🚀 <strong>Lançamento Exclusivo 2026<\u002Fstrong> · Feito para motoristas de van que querem mais passageiros e menos caos\n<\u002Fdiv>\n\n<!-- HERO -->\n<section class=\"hero\">\n  <div class=\"hero-road\">\n    <svg viewBox=\"0 0 1440 500\" preserveAspectRatio=\"xMidYMid slice\" xmlns=\"http://www.w3.org/2000/svg\">\n      <defs>\n        <linearGradient id=\"roadFade\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n          <stop offset=\"0%\" stop-color=\"white\" stop-opacity=\"0\"><\u002Fstop>\n          <stop offset=\"50%\" stop-color=\"white\" stop-opacity=\"0.04\"><\u002Fstop>\n          <stop offset=\"100%\" stop-color=\"white\" stop-opacity=\"0\"><\u002Fstop>\n        <\u002FlinearGradient>\n      <\u002Fdefs>\n      <line x1=\"0\" y1=\"120\" x2=\"1440\" y2=\"120\" stroke=\"rgba(245,158,11,0.07)\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"0\" y1=\"200\" x2=\"1440\" y2=\"200\" stroke=\"rgba(245,158,11,0.05)\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"0\" y1=\"280\" x2=\"1440\" y2=\"280\" stroke=\"rgba(245,158,11,0.07)\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"0\" y1=\"360\" x2=\"1440\" y2=\"360\" stroke=\"rgba(245,158,11,0.05)\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"0\" y1=\"250\" x2=\"1440\" y2=\"250\" stroke=\"rgba(245,158,11,0.18)\" stroke-width=\"2\" stroke-dasharray=\"40 30\">\n        <animate attributeName=\"stroke-dashoffset\" from=\"0\" to=\"-140\" dur=\"3s\" repeatCount=\"indefinite\"><\u002Fanimate>\n      <\u002Fline>\n      <circle cx=\"200\" cy=\"180\" r=\"1.5\" fill=\"rgba(245,158,11,0.25)\"><\u002Fcircle>\n      <circle cx=\"600\" cy=\"320\" r=\"1\" fill=\"rgba(37,99,235,0.2)\"><\u002Fcircle>\n      <circle cx=\"1100\" cy=\"150\" r=\"2\" fill=\"rgba(245,158,11,0.2)\"><\u002Fcircle>\n      <circle cx=\"900\" cy=\"400\" r=\"1.5\" fill=\"rgba(37,99,235,0.15)\"><\u002Fcircle>\n    <\u002Fsvg>\n  <\u002Fdiv>\n\n  <div class=\"hero-content container\">\n    <div class=\"hero-eyebrow\">🚐 Vangenda · App para Motoristas de Van<\u002Fdiv>\n\n    <h1>\n      <em>Atenção, motorista de van!<\u002Fem><br>\n      Esse app está mudando a forma de<br>agendar passageiros em todo o Brasil\n    <\u002Fh1>\n\n    <p class=\"sub\">\n      Chega de bagunça no WhatsApp — o <strong>Vangenda<\u002Fstrong> dá controle total da sua agenda,\n      <strong>mais passageiros e menos dor de cabeça<\u002Fstrong>\n    <\u002Fp>\n\n    <div class=\"hero-stat\">\n      🚐 Mais de <strong>500 motoristas<\u002Fstrong> já organizaram suas vans com o Vangenda\n    <\u002Fdiv>\n\n    <img src=\"https://fluxoseguro.site/wp-content/uploads/2026/05/9ec3be21-0b1f-4846-b67b-a25a0356423a_11zon_11zon.webp\" alt=\"App Vangenda\" class=\"mockup\">\n\n    <a href=\"#oferta\" class=\"cta-btn\">Quero Organizar Minha Van<\u002Fa>\n    <span class=\"cta-sub\">✅ <strong>Acesso imediato<\u002Fstrong> • 7 dias de garantia<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- CONSEQUÊNCIA FINANCEIRA -->\n<section>\n  <div class=\"container\" style=\"text-align:center;\">\n    <div class=\"section-label\">O Problema<\u002Fdiv>\n    <h2>Poltrona vazia na estrada é <span>dinheiro indo embora<\u002Fspan><\u002Fh2>\n    <p style=\"max-width:700px; margin:0 auto 28px; color:var(--mid);\">Para quem trabalha com van, cada vaga conta. Porque o óleo não espera. A manutenção não espera. A parcela da van não espera.<\u002Fp>\n    <p style=\"max-width:700px; margin:0 auto 32px; font-weight:700; font-size:clamp(1rem,3vw,1.1rem); color:var(--red);\">E quando um passageiro falta ou você perde uma reserva por desorganização, quem paga a conta é você.<\u002Fp>\n\n    <div class=\"dor-box reveal\">\n      <h3 style=\"margin-bottom:8px;\">O problema não é falta de esforço. Você já trabalha muito.<\u002Fh3>\n      <p class=\"intro\">O problema é tentar controlar um negócio inteiro usando:<\u002Fp>\n      <ul class=\"dor-lista\">\n        <li>Caderno<\u002Fli>\n        <li>Memória<\u002Fli>\n        <li>Conversa perdida no WhatsApp<\u002Fli>\n        <li>Áudio antigo<\u002Fli>\n        <li>Mensagem marcada como não lida<\u002Fli>\n        <li>Papel dentro da van<\u002Fli>\n        <li>Lista feita às pressas<\u002Fli>\n      <\u002Ful>\n      <div class=\"dor-alert\">\n        Isso até funciona por um tempo. Mas quando a demanda aumenta, começa a bagunça.\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- SOLUÇÃO -->\n<section class=\"alt\">\n  <div class=\"container\">\n    <div class=\"solucao-inner\">\n      <div class=\"solucao-img reveal\">\n        <img src=\"https://fluxoseguro.site/wp-content/uploads/2026/05/c74704a4-39ff-476b-aa6b-602e74990b2e_11zon_11zon.webp\" alt=\"Tela do aplicativo mostrando agenda de viagens\" style=\"border-radius:var(--radius-lg); box-shadow:0 20px 50px rgba(0,0,0,0.12);\">\n      <\u002Fdiv>\n      <div class=\"solucao-txt reveal\">\n        <div class=\"section-label\">A Solução<\u002Fdiv>\n        <h2>Conheça o <em>Vangenda<\u002Fem><\u002Fh2>\n        <p>O aplicativo que ajuda o motorista de van a organizar passageiros, viagens, vagas e financeiro direto pelo celular.<\u002Fp>\n        <p>Não foi feito para empresa grande, nem para escritório cheio de computador. Foi pensado para o motorista que está na estrada, atende passageiro pelo celular e precisa de uma ferramenta simples para organizar a rotina.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- PROMESSA -->\n<section>\n  <div class=\"container\" style=\"text-align:center;\">\n    <div class=\"section-label\">A Promessa<\u002Fdiv>\n    <h2>Nunca mais perca passageiro porque <span>esqueceu de anotar<\u002Fspan> ou pediu para chamar depois<\u002Fh2>\n    <p style=\"max-width:720px; margin:16px auto;\">Com o Vangenda, você agenda passageiros para qualquer dia, horário e rota. Se o cliente ligar pedindo vaga para daqui 5, 10 ou 15 dias, você cadastra na hora e a viagem já fica organizada no sistema.<\u002Fp>\n    <p style=\"max-width:720px; margin:0 auto 16px;\">Além disso, você compartilha seu link de agendamento com os passageiros de rotina. Eles acessam quando quiserem, escolhem a data e fazem a solicitação sem precisar esperar você responder.<\u002Fp>\n    <p style=\"max-width:720px; margin:0 auto; font-weight:700; color:var(--ink);\">Você ganha tempo, evita confusão no WhatsApp e passa muito mais profissionalismo para quem viaja com você.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- BENEFÍCIOS -->\n<section class=\"alt\">\n  <div class=\"container\">\n    <div style=\"text-align:center;\">\n      <div class=\"section-label\">Funcionalidades<\u002Fdiv>\n      <h2>Tudo que o <em>Vangenda<\u002Fem> faz por você<\u002Fh2>\n      <p style=\"max-width:560px; margin:0 auto 8px; color:var(--mid);\">Uma ferramenta completa pensada para o motorista que está na estrada e precisa de controle total pelo celular<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"beneficios-cat\">📅 Agendamento<\u002Fdiv>\n    <div class=\"beneficios-grid\">\n      <div class=\"ben-card reveal\">\n        <div class=\"ben-num\">1<\u002Fdiv>\n        <h3>Agendamento completo pelo motorista<\u002Fh3>\n        <p>Recebeu ligação ou mensagem? Cadastre o passageiro na hora com endereço completo e ponto de referência. Tudo salvo e organizado no sistema.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ben-card reveal\">\n        <div class=\"ben-num\">2<\u002Fdiv>\n        <h3>Passageiro instala seu app no celular<\u002Fh3>\n        <p>O Vangenda é um PWA — o passageiro instala direto na tela do celular como se fosse um aplicativo de loja. Com um toque ele acessa sua agenda, escolhe a data e reserva a vaga, a qualquer hora, sem precisar falar com você.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ben-card reveal\">\n        <div class=\"ben-num\">3<\u002Fdiv>\n        <h3>Calendário visual completo<\u002Fh3>\n        <p>Clique em qualquer dia e veja todos os passageiros agendados, a rota, o horário e os dados de cada um. Sem procurar nada.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ben-card reveal\">\n        <div class=\"ben-num\">4<\u002Fdiv>\n        <h3>Rota direto no Google Maps<\u002Fh3>\n        <p>Cada agendamento já vem com o endereço e ponto de referência do passageiro. Um toque no botão do Maps e a rota até a casa dele já está aberta e pronta pra você sair.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"beneficios-cat\">🗺️ Rotas &amp; Precificação<\u002Fdiv>\n    <div class=\"beneficios-grid\">\n      <div class=\"ben-card reveal\">\n        <div class=\"ben-num\">5<\u002Fdiv>\n        <h3>Configure suas rotas com valores<\u002Fh3>\n        <p>Cadastre todos os destinos que você atende. O sistema gera automaticamente as combinações de localidades e você define o valor de cada trecho.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ben-card reveal\">\n        <div class=\"ben-num\">6<\u002Fdiv>\n        <h3>Pix gerado na hora certa<\u002Fh3>\n        <p>Quando o passageiro agenda e escolhe o destino, o sistema já identifica a localidade e gera o Pix no valor exato daquele trecho. Sem você precisar calcular ou cobrar manualmente.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"beneficios-cat\">🔗 Link &amp; Pagamento<\u002Fdiv>\n    <div class=\"beneficios-grid\">\n      <div class=\"ben-card reveal\">\n        <div class=\"ben-num\">7<\u002Fdiv>\n        <h3>Seu link de agendamento<\u002Fh3>\n        <p>Um link exclusivo seu. Manda no grupo do WhatsApp, no status ou direto pro passageiro. Ele agenda sozinho, 24h por dia.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ben-card reveal\">\n        <div class=\"ben-num\">8<\u002Fdiv>\n        <h3>Pagamento no ato<\u002Fh3>\n        <p>O passageiro paga no momento do agendamento. Você não precisa ficar cobrando depois — a vaga já vem paga.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ben-card reveal\">\n        <div class=\"ben-num\">9<\u002Fdiv>\n        <h3>Notificação automática<\u002Fh3>\n        <p>Assim que o pagamento é confirmado, o passageiro recebe notificação no celular. Você também é avisado em tempo real.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"beneficios-cat\">💬 Comunicação<\u002Fdiv>\n    <div class=\"beneficios-grid\">\n      <div class=\"ben-card reveal\">\n        <div class=\"ben-num\">10<\u002Fdiv>\n        <h3>Confirmação com 1 clique<\u002Fh3>\n        <p>Quer confirmar se o passageiro vai? Um clique envia mensagem automática via WhatsApp ou inicia uma ligação. Sem digitar nada.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ben-card reveal\">\n        <div class=\"ben-num\">11<\u002Fdiv>\n        <h3>Mensagens automáticas<\u002Fh3>\n        <p>O sistema envia mensagens prontas para lembrar o passageiro da viagem, confirmar presença e reduzir faltas na van.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"beneficios-cat\">💰 Financeiro<\u002Fdiv>\n    <div class=\"beneficios-grid\">\n      <div class=\"ben-card reveal\">\n        <div class=\"ben-num\">12<\u002Fdiv>\n        <h3>Faturamento em tempo real<\u002Fh3>\n        <p>Cada pagamento recebido entra automaticamente no financeiro. Acompanhe quanto entrou hoje, essa semana ou esse mês.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ben-card reveal\">\n        <div class=\"ben-num\">13<\u002Fdiv>\n        <h3>Lucro real — sem achismo<\u002Fh3>\n        <p>Veja o lucro dos últimos 7 ou 30 dias com precisão. Receitas menos despesas igual ao que sobrou de verdade no seu bolso.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ben-card reveal\">\n        <div class=\"ben-num\">14<\u002Fdiv>\n        <h3>Receitas e despesas<\u002Fh3>\n        <p>Cadastre combustível, manutenção, pedágio e qualquer gasto. Saiba exatamente onde está gastando mais.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ben-card reveal\">\n        <div class=\"ben-num\">15<\u002Fdiv>\n        <h3>Controle de fiados<\u002Fh3>\n        <p>Tem passageiro que paga depois? Registre o fiado na hora e acompanhe tudo organizado em uma subaba exclusiva. Nada esquecido, nada perdido.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ben-card reveal\">\n        <div class=\"ben-num\">16<\u002Fdiv>\n        <h3>Relatório por rota<\u002Fh3>\n        <p>Descubra quais rotas dão mais lucro e quais estão no prejuízo. Decida melhor onde investir seu tempo e combustível.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"ben-summary\">\n      <span>Agenda completa<\u002Fspan>\n      <span>App instalável pelo passageiro<\u002Fspan>\n      <span>Endereço + ponto de referência<\u002Fspan>\n      <span>Rota no Google Maps<\u002Fspan>\n      <span>Pix automático por localidade<\u002Fspan>\n      <span>Notificações em tempo real<\u002Fspan>\n      <span>WhatsApp com 1 clique<\u002Fspan>\n      <span>Financeiro completo<\u002Fspan>\n      <span>Controle de fiados<\u002Fspan>\n      <span>Lucro real<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- ANTES E DEPOIS -->\n<section>\n  <div class=\"container\" style=\"text-align:center;\">\n    <div class=\"section-label\">Antes &amp; Depois<\u002Fdiv>\n    <h2>De um lado, a <span>bagunça<\u002Fspan>. Do outro, o controle da sua van<\u002Fh2>\n    <p style=\"max-width:760px; margin:16px auto;\">Ser motorista de van não é só dirigir. É responder passageiro, marcar viagem, controlar vaga, receber pagamento, pagar despesa, lembrar de quem confirmou e ainda tentar descobrir se o mês deu lucro.<\u002Fp>\n    <p style=\"max-width:760px; margin:0 auto 28px; font-weight:700; color:var(--blue);\">O Vangenda foi feito para tirar esse peso da sua cabeça e colocar sua agenda, seus passageiros e seu financeiro em um só lugar.<\u002Fp>\n    <div class=\"comparacao reveal\">\n      <div class=\"col-antes\">\n        <div class=\"col-head\">❌ SEM o Vangenda<\u002Fdiv>\n        <ul class=\"col-list\">\n          <li>Você tenta lembrar de tudo de cabeça<\u002Fli>\n          <li>Passageiro fica perdido no WhatsApp<\u002Fli>\n          <li>Pedido de viagem futura acaba esquecido<\u002Fli>\n          <li>Você diz \"me chama mais perto\" e perde o cliente<\u002Fli>\n          <li>Difícil saber quem confirmou e quem está pendente<\u002Fli>\n          <li>Não sabe quantas vagas ainda tem disponíveis<\u002Fli>\n          <li>Dinheiro entra, despesas saem e tudo se mistura<\u002Fli>\n          <li>No fim do mês: \"trabalhei demais, mas quanto ganhei?\"<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"col-depois\">\n        <div class=\"col-head\">✅ COM o Vangenda<\u002Fdiv>\n        <ul class=\"col-list\">\n          <li>Cadastra passageiros na hora, pelo celular<\u002Fli>\n          <li>Viagens organizadas por data, horário e rota<\u002Fli>\n          <li>Agendamentos futuros salvos no sistema<\u002Fli>\n          <li>Você diz com segurança: \"sua vaga está marcada\"<\u002Fli>\n          <li>Passageiro agenda pelo seu link a qualquer hora<\u002Fli>\n          <li>Acompanha melhor a lotação da van<\u002Fli>\n          <li>Registra entradas, pagamentos e pendências<\u002Fli>\n          <li>Vê o saldo líquido na tela — o que sobrou de verdade<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- OBJEÇÕES -->\n<section class=\"alt\">\n  <div class=\"container\">\n    <div style=\"text-align:center;\">\n      <div class=\"section-label\">Dúvidas<\u002Fdiv>\n      <h2>Tirando suas <em>dúvidas<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"max-width:760px; margin:32px auto 0;\">\n      <div class=\"objecao reveal\">\n        <h3>\"Mas eu sempre usei caderno...\"<\u002Fh3>\n        <p>O caderno ajuda, mas pode sumir, molhar, rasgar e ser esquecido na van. Ele não lembra você de nada, não mostra seu financeiro e não organiza viagens futuras. O Vangenda vem para fazer o que o caderno não consegue.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"objecao reveal\">\n        <h3>\"Mas eu não sou bom com tecnologia...\"<\u002Fh3>\n        <p>Você não precisa ser. Se sabe mexer no WhatsApp, já consegue usar. Nada de tela complicada ou linguagem de escritório. É uma ferramenta feita para motorista.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"objecao reveal\">\n        <h3>\"Mas meus passageiros vão usar?\"<\u002Fh3>\n        <p>O sistema é para facilitar principalmente a SUA organização. O passageiro continua falando com você como já fala hoje. A diferença é que você registra tudo no aplicativo em vez de depender da memória.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"objecao reveal\">\n        <h3>\"Será que vale a pena pagar por isso?\"<\u002Fh3>\n        <p>Se você perder apenas uma vaga por esquecimento, já perdeu mais do que o valor do sistema. O Vangenda não é gasto. É organização para proteger seu dinheiro.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- COMO FUNCIONA -->\n<section>\n  <div class=\"container\" style=\"text-align:center;\">\n    <div class=\"section-label\">Como Funciona<\u002Fdiv>\n    <h2>Como funciona <em>na prática<\u002Fem><\u002Fh2>\n    <div class=\"passos\">\n      <div class=\
